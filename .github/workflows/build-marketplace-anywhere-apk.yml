name: Build Marketplace Anywhere APK

on:
  push:
    branches: [marketplace-anywhere-apk]
    paths:
      - 'marketplace-anywhere-android/**'
      - '.github/workflows/build-marketplace-anywhere-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'marketplace-anywhere-android/**'
      - '.github/workflows/build-marketplace-anywhere-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          "$SDKMANAGER" --list_installed

      - name: Build debug APK
        working-directory: marketplace-anywhere-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify package, permissions and signature
        shell: bash
        run: |
          set -euo pipefail
          APK='marketplace-anywhere-android/app/build/outputs/apk/debug/app-debug.apk'
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/aapt" dump badging "$APK" | tee apk-badging.txt
          "$TOOLS/aapt" dump permissions "$APK" | tee apk-permissions.txt
          if grep -q 'uses-permission' apk-permissions.txt; then
            echo 'Unexpected permissions found'
            exit 1
          fi
          cp "$APK" Marketplace-Anywhere-v0.4-personal.apk
          sha256sum Marketplace-Anywhere-v0.4-personal.apk | tee SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Marketplace-Anywhere-v0.4-personal
          path: |
            Marketplace-Anywhere-v0.4-personal.apk
            SHA256.txt
            apk-badging.txt
            apk-permissions.txt
          if-no-files-found: error
