# The guided-imagery meditation app is deliberately NOT deployed here.
#
# It is a personal tool, run locally (see README). A public URL would leave the
# Gemini and TTS keys reachable by anyone who found it, and the spend would be
# on whoever owns those keys. Run it with `python backend/main.py` instead.
#
# Only the spectrum-rights static site is published from this repo.

services:
  - type: web
    name: spectrum-rights
    runtime: static
    buildCommand: cd spectrum-rights && npm install && npm run build
    staticPublishPath: spectrum-rights/dist
